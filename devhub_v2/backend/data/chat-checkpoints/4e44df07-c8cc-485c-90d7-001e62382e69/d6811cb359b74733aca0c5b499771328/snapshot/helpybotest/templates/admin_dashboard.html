{% extends 'adminbase.html' %}

{% block content %}
<div class="container">
    <h2 class="dashboard-title">Admin Dashboard</h2>
    <div class="user-grid">
        {% for user in users %}
            <div class="user-card">
                <div class="user-card-header">
                    <div class="user-avatar">👤</div>
                    <h3>{{ user.username }}</h3>
                </div>
                <div class="user-card-content">
                    <div class="form-group">
                        <!-- OpenAI API Key -->
                        <div class="api-key-container">
                            <label>OpenAI API Key</label>
                            <div class="input-with-button">
                                <input type="text" class="api-key-input" 
                                       value="{{ user.openai_api_key|default:'' }}" 
                                       data-user-id="{{ user.id }}">
                                <button class="update-btn" onclick="updateAPIKey({{ user.id }})">
                                    Update
                                </button>
                            </div>
                        </div>

                        <!-- WhatsApp Credentials -->
                        <div class="api-key-container">
                            <label>WhatsApp License Number</label>
                            <div class="input-with-button">
                                <input type="text" 
                                       class="form-control" 
                                       value="{{ user.whatsapp_license_number|default:'' }}" 
                                       onchange="updateWhatsAppLicense('{{ user.id }}', this.value)"
                                       placeholder="Enter WhatsApp License">
                                <button class="update-btn" onclick="updateWhatsAppLicense({{ user.id }})">
                                    Update
                                </button>
                            </div>
                        </div>
                        <div class="api-key-container">
                            <label>WhatsApp API Key</label>
                            <div class="input-with-button">
                                <input type="text" class="whatsapp-api-input" 
                                       value="{{ user.whatsapp_api_key|default:'' }}" 
                                       data-user-id="{{ user.id }}">
                                <button class="update-btn" onclick="updateWhatsAppAPIKey({{ user.id }})">
                                    Update
                                </button>
                            </div>
                        </div>

                        <div class="api-key-container">
                            <label>WhatsApp App Key</label>
                            <div class="input-with-button">
                                <input type="text" class="whatsapp-appkey-input" 
                                       value="{{ user.whatsapp_appkey|default:'' }}" 
                                       data-user-id="{{ user.id }}">
                                <button class="update-btn" onclick="updateWhatsAppAppKey({{ user.id }})">
                                    Update
                                </button>
                            </div>
                        </div>
                        <div class="api-key-container">
                            <label>WhatsApp Auth Key</label>
                            <div class="input-with-button">
                                <input type="text" class="whatsapp-authkey-input" 
                                       value="{{ user.whatsapp_authkey|default:'' }}" 
                                       data-user-id="{{ user.id }}">
                                <button class="update-btn" onclick="updateWhatsAppAuthKey({{ user.id }})">
                                    Update
                                </button>
                            </div>
                        </div>

                        <!-- Telegram Credentials -->
                        <div class="api-key-container">
                            <label>Telegram Bot Token</label>
                            <div class="input-with-button">
                                <input type="text" class="telegram-token-input" 
                                       value="{{ user.telegram_bot_token|default:'' }}" 
                                       data-user-id="{{ user.id }}">
                                <button class="update-btn" onclick="updateTelegramToken({{ user.id }})">
                                    Update
                                </button>
                            </div>
                        </div>

                        <!-- Translation Toggle -->
                        <div class="toggle-container">
                            <label class="toggle-label">Translation</label>
                            <label class="switch">
                                <input type="checkbox" 
                                       class="translation-toggle" 
                                       data-user-id="{{ user.id }}"
                                       {% if user.translation_enabled %}checked{% endif %}
                                       onchange="toggleTranslation({{ user.id }}, this.checked)">
                                <span class="slider round"></span>
                            </label>
                        </div>
                        <div class="toggle-container">
                            <label class="toggle-label">Leads</label>
                            <label class="switch">
                                <input type="checkbox" 
                                       class="leads-toggle" 
                                       data-user-id="{{ user.id }}"
                                       {% if user.leads_enabled %}checked{% endif %}
                                       onchange="toggleLeads({{ user.id }}, this.checked)">
                                <span class="slider round"></span>
                            </label>
                        </div>

                        <button class="delete-btn" onclick="deleteUser({{ user.id }})">
                            Delete User
                        </button>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

<script>
    function updateWhatsAppAppKey(userId) {
        const appkeyInput = document.querySelector(`.whatsapp-appkey-input[data-user-id="${userId}"]`);
        
        const data = {
            whatsapp_appkey: appkeyInput.value
        };

        fetch(`/update-whatsapp-appkey/${userId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Update the input field with the returned value
                appkeyInput.value = data.whatsapp_appkey;
                alert('WhatsApp App Key updated successfully');
            } else {
                alert('Update failed: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Update failed');
        });
    }

    function updateWhatsAppAuthKey(userId) {
        const authkeyInput = document.querySelector(`.whatsapp-authkey-input[data-user-id="${userId}"]`);
        
        const data = {
            whatsapp_authkey: authkeyInput.value
        };

        fetch(`/update-whatsapp-authkey/${userId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Update the input field with the returned value
                authkeyInput.value = data.whatsapp_authkey;
                alert('WhatsApp Auth Key updated successfully');
            } else {
                alert('Update failed: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Update failed');
        });
    }

    function updateWhatsAppAppKey(userId) {
        const appkeyInput = document.querySelector(`.whatsapp-appkey-input[data-user-id="${userId}"]`);
        
        const data = {
            whatsapp_appkey: appkeyInput.value
        };
    
        fetch(`/update-whatsapp-appkey/${userId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('WhatsApp App Key updated successfully');
            } else {
                alert('Update failed: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Update failed');
        });
    }
    
    function updateWhatsAppAuthKey(userId) {
        const authkeyInput = document.querySelector(`.whatsapp-authkey-input[data-user-id="${userId}"]`);
        
        const data = {

        fetch(`/update-whatsapp-authkey/${userId}/`, {

            },

        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {

            }
        })

            console.error('Error:', error);

    function updateTelegramToken(userId) {
        const tokenInput = document.querySelector(`.telegram-token-input[data-user-id="${userId}"]`);
        
        const data = {
            telegram_bot_token: tokenInput.value
        };

        fetch(`/update-telegram-token/${userId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Telegram Bot Token updated successfully');
            } else {

        })
        .catch(error => {

    function updateAPIKey(userId) {
        const apiKeyInput = document.querySelector(`.api-key-input[data-user-id="${userId}"]`);
        
        const data = {
            api_key: apiKeyInput.value
        };

        fetch(`/update-api-key/${userId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Update successful');
            } else {
                alert('Update failed: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Update failed');
        });
    }

    function deleteUser(userId) {
        if (confirm('Are you sure you want to delete this user?')) {
            fetch(`/delete_user/${userId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Delete failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Delete failed');
            });
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function checkSession() {
        return fetch('/admin_dashboard/', {
            method: 'GET',
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            credentials: 'same-origin'
        }).then(response => {
            if (!response.ok || response.redirected) {
                window.location.reload();
                throw new Error('Session expired');
            }
            return true;
        });
    }

    function toggleTranslation(userId, enabled) {
        // First check if session is valid
        checkSession().then(() => {
            const csrftoken = getCookie('csrftoken');
            
            if (!csrftoken) {
                console.error('CSRF token not found');
                window.location.reload();
                return;
            }

            fetch(`/toggle-translation/${userId}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken,
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({
                    translation_enabled: enabled
                }),
                credentials: 'same-origin'
            })
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                    throw new Error('Redirected');
                }
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    // Update toggle state
                    const toggle = document.querySelector(`.translation-toggle[data-user-id="${userId}"]`);
                    if (toggle) {
                        toggle.checked = enabled;
                    }
                    
                    // Show success message
                    alert(enabled ? 'Translation enabled successfully' : 'Translation disabled successfully');
                    
                    // Reload page to reflect changes
                    window.location.reload();
                } else {
                    throw new Error(data.error || 'Update failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                // Revert toggle state
                const toggle = document.querySelector(`.translation-toggle[data-user-id="${userId}"]`);
                if (toggle) {
                    toggle.checked = !enabled;
                }
                alert('Update failed: ' + error.message);
                
                // If it's a session error, reload the page
                if (error.message.includes('Session') || error.message.includes('<!DOCTYPE')) {
                    window.location.reload();
                }
            });
        }).catch(() => {
            // Session check failed, reload page
            window.location.reload();
        });
    }

    function toggleLeads(userId, leadsEnabled) {
        $.ajax({
            url: `/toggle-leads/${userId}/`,
            type: 'POST',
            data: JSON.stringify({leads_enabled: leadsEnabled}),
            contentType: 'application/json',
            headers: {'X-CSRFToken': '{{ csrf_token }}'},
            success: function(response) {
                if (response.success) {
                    console.log('Leads setting updated successfully');
                    showPopupMessage(leadsEnabled);
                } else {
                    console.error('Error updating leads setting:', response.error);
                }
            },
            error: function(jqXHR, textStatus, errorThrown) {
                console.error('AJAX error:', textStatus, errorThrown);
            }
        });
    }

    function showPopupMessage(leadsEnabled) {
        var message = leadsEnabled ? 'Leads feature is now enabled.' : 'Leads feature is now disabled.';
        alert(message);
    }
</script>
