{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column; /* Align items vertically */
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            position: relative; /* To position the logo */
        }
        .logo-container {
            margin-bottom: 20px; /* Space between logo and form */
            text-align: center; /* Center the logo */
        }
        .logo-container img {
            max-width: 150px; /* Adjust the size of the logo */
            height: auto;
        }
        h3 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .remember-forgot a {
            color: #2C3C64; /* Changed link color */
            text-decoration: none;
        }
        .btn {
            background-color: #2C3C64; /* Changed button color */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #232f4f; /* Darker shade on hover */
        }
        .text-muted {
            color: #666;
            text-align: center;
            display: block;
            margin-bottom: 20px;
        }
        .footer {
            background-color: #2C3C64; /* Footer bar background color */
            color: white;
            padding: 10px 20px;
            width: 100%;
            text-align: center;
            position: fixed; /* Fixed at the bottom */
            bottom: 0;
            left: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Container Inside Login Form -->
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/traromal/Aromal_TR/refs/heads/main/helpyyyyyyyyyyyyyyy.PNG" alt="Helpybo Logo">
        </div>


        <span class="text-muted">
            {% if msg %}
                {{ msg | safe }}
            {% else %}
                Welcome back! Please login to your account.
            {% endif %}
        </span>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>
            <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <!-- Footer Section -->
    <div class="footer">
        Powered by Helpybo, copyright@ GAUDE Business and Infrastructure Solutions Pvt Ltd - 2024
    </div>
</body>
</html>
