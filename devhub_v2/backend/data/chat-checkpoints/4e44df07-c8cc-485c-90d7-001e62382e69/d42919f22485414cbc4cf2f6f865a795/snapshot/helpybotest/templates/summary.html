<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Summary</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .summary-container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }
        .meter {
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .meter-fill.hot {
            background-color: #ff6347; /* Tomato (Hot) */
            width: 100%;
        }
        .meter-fill.warm {
            background-color: #ffa500; /* Orange (Warm) */
            width: 60%;
        }
        .meter-fill.cold {
            background-color: #add8e6; /* Light Blue (Cold) */
            width: 20%;
        }
        .classification {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        .classification.hot {
            color: #ff6347;
        }
        .classification.warm {
            color: #ffa500;
        }
        .classification.cold {
            color: #add8e6;
        }
        .view-history-link {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .view-history-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="summary-container">
        <h1>Chat Summary</h1>
        <p>{{ summary }}</p>
        
        <!-- Meter to show Hot, Warm, or Cold -->
        <div class="meter">
            <div class="meter-fill {{ classification|lower }}"></div>
        </div>
        
        <!-- Classification Text -->
        <div class="classification {{ classification|lower }}">
            {{ classification }} Lead
        </div>

        <!-- Link to View Chat History -->
        <a href="{% url 'session_chat_history' session_id %}" class="view-history-link" target="_blank">
            View Chat History
        </a>
    </div>
</body>
</html>
