{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card shadow-lg" style="border-radius: 20px; border: none;">
        <div class="card-body p-4">
            <h2 class="text-center mb-4" style="color: #2c3c64; font-weight: 600;">Add Product</h2>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <!-- Form fields with enhanced styling -->
                <div class="form-group mb-4">
                    <label for="id_name" class="form-label fw-medium" style="color: #2c3c64;">Product Name</label>
                    <input type="text" name="{{ form.name.name }}" id="id_name" 
                           class="form-control form-control-lg"
                           style="border-radius: 12px; border: 1px solid #e0e0e0; padding: 12px;">
                </div>

                <div class="form-group mb-4">
                    <label for="id_description" class="form-label fw-medium" style="color: #2c3c64;">Description</label>
                    <textarea name="{{ form.description.name }}" id="id_description" 
                              class="form-control form-control-lg"
                              style="border-radius: 12px; border: 1px solid #e0e0e0; padding: 12px;"></textarea>
                </div>

                <div class="form-group mb-4">
                    <label for="id_image" class="form-label fw-medium" style="color: #2c3c64;">Product Image</label>
                    <input type="file" name="{{ form.image.name }}" id="id_image" 
                           class="form-control form-control-lg"
                           style="border-radius: 12px; border: 1px solid #e0e0e0; padding: 12px;">
                </div>

                <div class="form-group mb-4">
                    <label for="id_category" class="form-label fw-medium" style="color: #2c3c64;">Category</label>
                    {{ form.category }}
                </div>

                <div class="form-group mb-4">
                    <label for="id_price" class="form-label fw-medium" style="color: #2c3c64;">Price</label>
                    <input type="number" name="{{ form.price.name }}" id="id_price" 
                           class="form-control form-control-lg"
                           style="border-radius: 12px; border: 1px solid #e0e0e0; padding: 12px;">
                </div>

                <div class="form-group mb-4">
                    <label for="id_discount" class="form-label fw-medium" style="color: #2c3c64;">Discount/Offer</label>
                    <input type="number" name="{{ form.discount.name }}" id="id_discount" 
                           class="form-control form-control-lg"
                           style="border-radius: 12px; border: 1px solid #e0e0e0; padding: 12px;">
                </div>

                <div class="form-group mb-4">
                    <label for="id_video" class="form-label fw-medium" style="color: #2c3c64;">Video URL</label>
                    <input type="url" name="{{ form.video.name }}" id="id_video" 
                           class="form-control form-control-lg"
                           style="border-radius: 12px; border: 1px solid #e0e0e0; padding: 12px;">
                </div>

                <div class="form-group mb-4">
                    <label for="id_useful_link" class="form-label fw-medium" style="color: #2c3c64;">Useful Link</label>
                    <input type="url" name="{{ form.useful_link.name }}" id="id_useful_link" 
                           class="form-control form-control-lg"
                           style="border-radius: 12px; border: 1px solid #e0e0e0; padding: 12px;">
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-3 mb-4">
                    <button type="button" class="btn flex-grow-1" data-bs-toggle="modal" data-bs-target="#addCategoryModal" 
                            style="background-color: var(--card-bg); color: #2c3c64; border: 2px solid #2c3c64; border-radius: 12px; padding: 12px;">
                        Add New Category
                    </button>
                    <button type="submit" class="btn flex-grow-1" 
                            style="background-color: #2c3c64; color: white; border-radius: 12px; padding: 12px;">
                        Add Product
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal with matching styling -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px; border: none;">
            <div class="modal-header border-0" style="background-color: #2c3c64; color: white; border-top-left-radius: 20px; border-top-right-radius: 20px;">
                <h5 class="modal-title">Add New Category</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="categoryForm" method="post" action="{% url 'add_category' %}">
                    {% csrf_token %}
                    <div class="form-group mb-4">
                        <label class="form-label fw-medium" style="color: #2c3c64;">Category Name</label>
                        <input type="text" class="form-control form-control-lg" id="id_name" name="name" required 
                               style="border-radius: 12px; border: 1px solid #e0e0e0; padding: 12px;">
                    </div>
                    <button type="submit" class="btn w-100" 
                            style="background-color: #2c3c64; color: white; border-radius: 12px; padding: 12px;">
                        Add Category
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('categoryForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        fetch("{% url 'add_category' %}", {
            method: 'POST',
            body: new FormData(this),
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Close modal and clean up
                const modalElement = document.getElementById('addCategoryModal');
                const modalInstance = bootstrap.Modal.getInstance(modalElement);
                
                // Remove all backdrops
                const backdrops = document.querySelectorAll('.modal-backdrop');
                backdrops.forEach(backdrop => backdrop.remove());
                
                // Clean up modal-related classes and styles
                document.body.classList.remove('modal-open');
                document.body.style.removeProperty('overflow');
                document.body.style.removeProperty('padding-right');
                
                // Hide modal
                if (modalInstance) {
                    modalInstance.dispose();
                }
                modalElement.style.display = 'none';
                
                // Update category dropdown
                var categorySelect = document.getElementById('id_category');
                var newOption = document.createElement('option');
                newOption.value = data.category_id;
                newOption.text = data.category_name;
                categorySelect.add(newOption);
                categorySelect.value = data.category_id;
                
                // Reset form
                document.getElementById('categoryForm').reset();
            } else {
                alert('Error: ' + JSON.stringify(data.errors));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while adding the category');
        });
    });

    // Add event listener for modal hidden event
    document.getElementById('addCategoryModal').addEventListener('hidden.bs.modal', function () {
        // Clean up any remaining backdrops
        const backdrops = document.querySelectorAll('.modal-backdrop');
        backdrops.forEach(backdrop => backdrop.remove());
        
        // Reset body
        document.body.classList.remove('modal-open');
        document.body.style.removeProperty('overflow');
        document.body.style.removeProperty('padding-right');
    });
</script>
{% endblock %}
